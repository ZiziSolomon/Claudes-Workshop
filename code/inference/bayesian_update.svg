<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #121419; }
      .panel { fill: #18191b; stroke: #282a32; stroke-width: 1; }
      .text { font-family: monospace; font-size: 12px; fill: #d2d7e1; }
      .text-lg { font-family: monospace; font-size: 16px; fill: #d2d7e1; font-weight: bold; }
      .text-muted { font-family: monospace; font-size: 11px; fill: #6e7382; }
      .label { font-family: monospace; font-size: 13px; fill: #d2d7e1; }
      .grid { stroke: #282a32; stroke-width: 1; }
      .red { fill: #ff6464; }
      .amber { fill: #ffbe3c; }
      .blue { fill: #64c8ff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" class="bg"/>

  <!-- Panel 0: Prior → Likelihood → Posterior -->
  <g id="panel0">
    <!-- Panel background -->
    <rect x="50" y="50" width="500" height="420" class="panel"/>

    <!-- Title -->
    <text x="300" y="70" text-anchor="middle" class="text-lg">Bayesian Update: Three Cases</text>

    <!-- Case 1: 1% prevalence (red) -->
    <g id="case1">
      <text x="75" y="110" class="text">1.0% disease prevalence</text>

      <text x="75" y="135" class="label">Prior:</text>
      <rect x="135" y="127" width="14" height="18" class="red"/>
      <text x="155" y="142" class="label">1.0%</text>

      <text x="75" y="165" class="label">Likelihood:</text>
      <text x="135" y="180" class="text-muted">19.0:1</text>

      <text x="75" y="205" class="label">Posterior:</text>
      <rect x="135" y="197" width="76" height="18" class="red" stroke="#d2d7e1" stroke-width="2"/>
      <text x="220" y="212" class="label">16.1%</text>
    </g>

    <!-- Case 2: 5% prevalence (amber) -->
    <g id="case2">
      <text x="270" y="110" class="text">5.0% disease prevalence</text>

      <text x="270" y="135" class="label">Prior:</text>
      <rect x="330" y="127" width="28" height="18" class="amber"/>
      <text x="365" y="142" class="label">5.0%</text>

      <text x="270" y="165" class="label">Likelihood:</text>
      <text x="330" y="180" class="text-muted">19.0:1</text>

      <text x="270" y="205" class="label">Posterior:</text>
      <rect x="330" y="197" width="228" height="18" class="amber" stroke="#d2d7e1" stroke-width="2"/>
      <text x="570" y="212" class="label">49.2%</text>
    </g>

    <!-- Case 3: 50% prevalence (blue) -->
    <g id="case3">
      <text x="75" y="270" class="text">50% disease prevalence</text>

      <text x="75" y="295" class="label">Prior:</text>
      <rect x="135" y="287" width="285" height="18" class="blue"/>
      <text x="430" y="302" class="label">50%</text>

      <text x="75" y="325" class="label">Likelihood:</text>
      <text x="135" y="340" class="text-muted">19.0:1</text>

      <text x="75" y="365" class="label">Posterior:</text>
      <rect x="135" y="357" width="399" height="18" class="blue" stroke="#d2d7e1" stroke-width="2"/>
      <text x="545" y="372" class="label">95.0%</text>
    </g>

    <!-- Caption -->
    <text x="75" y="430" class="text-muted">Test: 95% sensitivity, 95% specificity</text>
  </g>

  <!-- Panel 1: Posterior vs Prior curve -->
  <g id="panel1">
    <!-- Panel background -->
    <rect x="600" y="50" width="550" height="420" class="panel"/>

    <!-- Title -->
    <text x="875" y="70" text-anchor="middle" class="text-lg">Posterior vs Prior Probability</text>

    <!-- Plot area -->
    <rect x="650" y="105" width="450" height="300" fill="none" class="grid" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="650" y1="105" x2="1100" y2="105" class="grid"/>
    <line x1="650" y1="150" x2="1100" y2="150" class="grid"/>
    <line x1="650" y1="195" x2="1100" y2="195" class="grid"/>
    <line x1="650" y1="240" x2="1100" y2="240" class="grid"/>
    <line x1="650" y1="285" x2="1100" y2="285" class="grid"/>
    <line x1="650" y1="330" x2="1100" y2="330" class="grid"/>
    <line x1="650" y1="375" x2="1100" y2="375" class="grid"/>
    <line x1="650" y1="405" x2="1100" y2="405" class="grid"/>

    <line x1="650" y1="105" x2="650" y2="405" class="grid"/>
    <line x1="725" y1="105" x2="725" y2="405" class="grid"/>
    <line x1="800" y1="105" x2="800" y2="405" class="grid"/>
    <line x1="875" y1="105" x2="875" y2="405" class="grid"/>
    <line x1="950" y1="105" x2="950" y2="405" class="grid"/>
    <line x1="1025" y1="105" x2="1025" y2="405" class="grid"/>
    <line x1="1100" y1="105" x2="1100" y2="405" class="grid"/>

    <!-- Diagonal reference (posterior = prior) -->
    <line x1="650" y1="405" x2="1100" y2="105" stroke="#505064" stroke-width="1"/>

    <!-- Bayes curve -->
    <!-- Parametric curve showing P(disease | +) as function of P(disease) -->
    <!-- Using sensitivity=0.95, specificity=0.95 -->
    <polyline points="
      650,405
      657.38,404.23
      664.76,403.39
      672.14,402.48
      679.52,401.48
      686.91,400.39
      694.29,399.21
      701.67,397.92
      709.05,396.52
      716.43,395.00
      723.81,393.34
      731.19,391.53
      738.57,389.57
      745.95,387.44
      753.33,385.11
      760.71,382.59
      768.10,379.85
      775.48,376.88
      782.86,373.66
      790.24,370.18
      797.62,366.42
      805.00,362.36
      812.38,357.99
      819.76,353.30
      827.14,348.26
      834.52,342.86
      841.90,337.09
      849.29,330.93
      856.67,324.35
      864.05,317.33
      871.43,309.85
      878.81,301.87
      886.19,293.36
      893.57,284.30
      900.95,274.66
      908.33,264.41
      915.71,253.52
      923.10,241.95
      930.48,229.68
      937.86,216.67
      945.24,202.88
      952.62,188.27
      960.00,172.82
      967.38,156.51
      974.76,139.31
      982.14,121.22
      989.52,102.22
      996.90,82.31
      1004.29,61.51
      1011.67,39.82
      1019.05,17.37
      1026.43,0
      1100,0
    " fill="none" stroke="#64c8ff" stroke-width="2"/>

    <!-- Mark example points -->
    <!-- 1% point -->
    <circle cx="658.88" cy="396.23" r="4" class="red" stroke="#d2d7e1" stroke-width="2"/>
    <!-- 5% point -->
    <circle cx="672.94" cy="386.07" r="4" class="amber" stroke="#d2d7e1" stroke-width="2"/>
    <!-- 50% point -->
    <circle cx="875" cy="224" r="4" class="blue" stroke="#d2d7e1" stroke-width="2"/>

    <!-- Axis labels -->
    <text x="875" y="425" text-anchor="middle" class="text-muted">Prior probability →</text>
    <text x="620" y="260" text-anchor="middle" class="text-muted" transform="rotate(-90 620 260)">Posterior ↑</text>

    <!-- Tick labels -->
    <text x="650" y="420" text-anchor="middle" class="text-muted">0</text>
    <text x="725" y="420" text-anchor="middle" class="text-muted">20</text>
    <text x="800" y="420" text-anchor="middle" class="text-muted">40</text>
    <text x="875" y="420" text-anchor="middle" class="text-muted">60</text>
    <text x="950" y="420" text-anchor="middle" class="text-muted">80</text>
    <text x="1025" y="420" text-anchor="middle" class="text-muted">100</text>

    <text x="630" y="410" text-anchor="end" class="text-muted">0</text>
    <text x="630" y="330" text-anchor="end" class="text-muted">25</text>
    <text x="630" y="255" text-anchor="end" class="text-muted">50</text>
    <text x="630" y="180" text-anchor="end" class="text-muted">75</text>
    <text x="630" y="110" text-anchor="end" class="text-muted">100</text>

    <!-- Caption -->
    <text x="660" y="450" class="text-muted">
      Invariant: The curve shape never changes.
    </text>
    <text x="660" y="465" class="text-muted">
      Only the starting prior determines the endpoint.
    </text>
  </g>

  <!-- Key insight box -->
  <g id="insight" transform="translate(50, 480)">
    <text class="text">
      <tspan x="0" dy="0" font-weight="bold">Key insight:</tspan>
      <tspan x="0" dy="15">Likelihood ratio (19:1) is invariant — same for all priors.</tspan>
      <tspan x="0" dy="15">But posterior depends on prior. Starting point determines destination.</tspan>
    </text>
  </g>
</svg>
