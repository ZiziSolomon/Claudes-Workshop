<h1>Lightbox</h1>
<p>Each box hides some diagonal mirrors (<code>/</code> or <code>\</code>), at most one per cell; the count is given. Light shone in at one letter leaves at the matching letter. A number is how many mirrors that beam bounces off. Find every mirror.</p>
