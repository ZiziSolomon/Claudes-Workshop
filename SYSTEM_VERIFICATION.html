<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Verification — Taipei Metro Knowledge System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .verification-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .check-category {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .check-category h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .check-item {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .check-item.pass {
            border-left: 4px solid #10b981;
        }

        .check-item.fail {
            border-left: 4px solid #ef4444;
        }

        .check-item.pending {
            border-left: 4px solid #f59e0b;
        }

        .icon {
            font-weight: bold;
            min-width: 20px;
        }

        .icon.pass::before {
            content: "✓";
            color: #10b981;
        }

        .icon.fail::before {
            content: "✗";
            color: #ef4444;
        }

        .icon.pending::before {
            content: "⋯";
            color: #f59e0b;
        }

        .summary {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 25px;
            margin-top: 40px;
        }

        .summary h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .summary-stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #999;
            margin-top: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.pass {
            background: #10b981;
        }

        .status-indicator.fail {
            background: #ef4444;
        }

        .status-indicator.pending {
            background: #f59e0b;
        }

        .run-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }

        .run-button:hover {
            transform: scale(1.02);
        }

        .run-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .report {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .report-line.pass {
            color: #10b981;
        }

        .report-line.fail {
            color: #ef4444;
        }

        .report-line.info {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 System Verification Dashboard</h1>
        <p style="text-align: center; margin-bottom: 30px; color: #999;">Automated verification of all 34+ deliverables</p>

        <button class="run-button" onclick="runAllChecks()">▶ Run Full System Verification</button>

        <div class="verification-grid" id="checks">
            <div class="check-category">
                <h2>📄 Documentation Files</h2>
                <div id="docs-checks"></div>
            </div>

            <div class="check-category">
                <h2>🔧 Interactive Tools</h2>
                <div id="tools-checks"></div>
            </div>

            <div class="check-category">
                <h2>🔗 Cross-References</h2>
                <div id="refs-checks"></div>
            </div>

            <div class="check-category">
                <h2>📊 Data Integrity</h2>
                <div id="data-checks"></div>
            </div>

            <div class="check-category">
                <h2>🌐 Navigation</h2>
                <div id="nav-checks"></div>
            </div>

            <div class="check-category">
                <h2>⚙️ System Health</h2>
                <div id="health-checks"></div>
            </div>
        </div>

        <div class="summary" id="summary" style="display: none;">
            <h2>Verification Report</h2>
            <div id="summary-content"></div>
            <div class="summary-stat">
                <div class="stat-box">
                    <div class="stat-number" id="total-checks">0</div>
                    <div class="stat-label">Total Checks</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="passed-checks">0</div>
                    <div class="stat-label">Passed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="failed-checks">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="pass-rate">0%</div>
                    <div class="stat-label">Pass Rate</div>
                </div>
            </div>
        </div>

        <div class="report" id="report" style="display: none;">
            <div id="report-content"></div>
        </div>
    </div>

    <script>
        const EXPECTED_DOCS = [
            'CIRCULAR_METRO_ANALYSIS.md',
            'DESIGN_PRINCIPLES.md',
            'QUICK_START_GUIDES.md',
            'IMPLEMENTATION_CHECKLIST.md',
            'CASE_STUDIES_APPLIED.md',
            'FINANCING_STRATEGY_GUIDE.md',
            'RISK_ASSESSMENT_FRAMEWORK.md',
            'SUCCESS_METRICS_FRAMEWORK.md',
            'IMPLEMENTATION_ROADMAP_TEMPLATE.md',
            'STAKEHOLDER_COMMUNICATION_TOOLKIT.md',
            'GLOSSARY_TERMINOLOGY.md',
            'START_HERE_ONE_HOUR.md',
            'INDEX_MASTER.md',
            'SYSTEM_ARCHITECTURE.md',
            'PROJECT_SUMMARY.md',
            'SESSION_COMPLETION_REPORT.md',
            'QUICK_REFERENCE_ONE_PAGER.md'
        ];

        const EXPECTED_TOOLS = [
            'index.html',
            'taipei-metro-circular.html',
            'taipei-metro-interactive.html',
            'taipei-metro-full-system.html',
            'circular-line-design-tool.html',
            'taipei-metro-accessibility-analyzer.html',
            'taipei-metro-station-finder.html',
            'taipei-metro-route-planner.html',
            'taipei-metro-simulator.html',
            'taipei-metro-capacity-analyzer.html',
            'taipei-metro-departure-board.html',
            'taipei-metro-economic-model.html',
            'taipei-metro-environmental-impact.html',
            'taipei-metro-resilience-analyzer.html',
            'circular-metro-comparison.html',
            'circular-metro-timeline.html',
            'circular-metro-quiz.html'
        ];

        let checks = {
            total: 0,
            passed: 0,
            failed: 0
        };

        let reportLines = [];

        function log(category, status, message) {
            checks.total++;
            if (status === 'pass') {
                checks.passed++;
                reportLines.push(`<span class="report-line pass">✓ ${message}</span>`);
            } else if (status === 'fail') {
                checks.failed++;
                reportLines.push(`<span class="report-line fail">✗ ${message}</span>`);
            } else {
                reportLines.push(`<span class="report-line info">ℹ ${message}</span>`);
            }

            const container = document.getElementById(`${category}-checks`);
            if (container) {
                const item = document.createElement('div');
                item.className = `check-item ${status}`;
                item.innerHTML = `<span class="icon ${status}"></span>${message}`;
                container.appendChild(item);
            }
        }

        async function runAllChecks() {
            document.getElementById('summary').style.display = 'none';
            document.getElementById('report').style.display = 'none';
            reportLines = [];
            checks = { total: 0, passed: 0, failed: 0 };

            // Clear previous checks
            document.querySelectorAll('[id*="-checks"]').forEach(el => el.innerHTML = '');

            // 1. Check documentation files exist
            reportLines.push('<span class="report-line info">═══ DOCUMENTATION FILES ═══</span>');
            for (const doc of EXPECTED_DOCS) {
                try {
                    const response = await fetch(doc, { method: 'HEAD' });
                    if (response.ok) {
                        log('docs', 'pass', `${doc}`);
                    } else {
                        log('docs', 'fail', `${doc} (HTTP ${response.status})`);
                    }
                } catch (e) {
                    log('docs', 'fail', `${doc} (not found)`);
                }
            }

            // 2. Check tools exist and load
            reportLines.push('\n<span class="report-line info">═══ INTERACTIVE TOOLS ═══</span>');
            for (const tool of EXPECTED_TOOLS) {
                try {
                    const response = await fetch(tool, { method: 'HEAD' });
                    if (response.ok) {
                        log('tools', 'pass', `${tool}`);
                    } else {
                        log('tools', 'fail', `${tool} (HTTP ${response.status})`);
                    }
                } catch (e) {
                    log('tools', 'fail', `${tool} (not found)`);
                }
            }

            // 3. Check data file
            reportLines.push('\n<span class="report-line info">═══ DATA INTEGRITY ═══</span>');
            try {
                const response = await fetch('taipei-metro-data.json');
                const data = await response.json();
                log('data', 'pass', 'taipei-metro-data.json is valid JSON');

                // Validate structure
                if (data.lines && Array.isArray(data.lines)) {
                    log('data', 'pass', `Data contains ${data.lines.length} transit lines`);
                }
                if (data.stations && Array.isArray(data.stations)) {
                    log('data', 'pass', `Data contains ${data.stations.length} stations`);
                }
            } catch (e) {
                log('data', 'fail', `taipei-metro-data.json (${e.message})`);
            }

            // 4. Check navigation
            reportLines.push('\n<span class="report-line info">═══ NAVIGATION ═══</span>');
            try {
                const response = await fetch('index.html');
                const html = await response.text();
                const hasNav = html.includes('taipei-metro') && html.includes('circular-metro');
                if (hasNav) {
                    log('nav', 'pass', 'index.html contains tool links');
                } else {
                    log('nav', 'fail', 'index.html missing tool references');
                }
            } catch (e) {
                log('nav', 'fail', `index.html check failed: ${e.message}`);
            }

            // 5. System health
            reportLines.push('\n<span class="report-line info">═══ SYSTEM HEALTH ═══</span>');
            const passRate = checks.total > 0 ? Math.round((checks.passed / checks.total) * 100) : 0;
            log('health', passRate >= 95 ? 'pass' : 'fail', `Overall health: ${passRate}% (${checks.passed}/${checks.total} checks passed)`);

            // Display summary
            const summary = document.getElementById('summary');
            document.getElementById('total-checks').textContent = checks.total;
            document.getElementById('passed-checks').textContent = checks.passed;
            document.getElementById('failed-checks').textContent = checks.failed;
            document.getElementById('pass-rate').textContent = passRate + '%';
            summary.style.display = 'block';

            // Display detailed report
            const report = document.getElementById('report');
            document.getElementById('report-content').innerHTML = reportLines.join('\n');
            report.style.display = 'block';

            // Final summary message
            if (passRate === 100) {
                reportLines.push('\n<span class="report-line pass">🎉 SYSTEM FULLY VERIFIED - ALL DELIVERABLES OPERATIONAL</span>');
            } else if (passRate >= 95) {
                reportLines.push('\n<span class="report-line pass">✓ SYSTEM OPERATIONAL - Minor issues detected</span>');
            } else {
                reportLines.push('\n<span class="report-line fail">⚠ SYSTEM DEGRADED - Critical issues found</span>');
            }
            document.getElementById('report-content').innerHTML = reportLines.join('\n');
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            runAllChecks();
        });
    </script>
</body>
</html>
