    margin: auto;
  }

  fieldset { border: medium double saddlebrown; }
  legend { font-variant: small-caps; font-size: larger; }
  #shelf ul { list-style: none; padding: unset; margin: unset; }
  #shelf li button {
    font: inherit; font-size: medium; color: inherit; background: none; border: thin solid transparent;
    cursor: pointer; text-align: left; display: block;
    width: -moz-available; width: -webkit-fill-available; width: stretch;
  }
  #shelf li button:hover { border-color: burlywood; }
  #shelf li button[aria-pressed="true"] { background: wheat; color: black; border-color: saddlebrown; }
  #shelf li.new button::after { content: " - new"; font-style: italic; color: firebrick; }
  .tag {
    background: wheat; border: thick solid wheat; outline: thin dashed saddlebrown;

  }
  .tag:empty { display: none; }
  .who { font-variant: small-caps; font-size: larger; }
  .say::before { content: open-quote; }
  .say::after { content: close-quote; }
  .you { color: dimgray; font-style: italic; }
  .you::before { content: "You: " open-quote; }
  .you::after { content: close-quote; }
  .narr { font-style: italic; color: saddlebrown; }
  body.night .narr { color: lightsteelblue; }
  .controls span { display: inline-block; border: thick solid transparent; }
  .controls button {
    font: inherit; font-size: medium; cursor: pointer; background: ivory;
    border: thin solid saddlebrown;
  }
  .controls button:disabled { color: silver; border-color: silver; cursor: default; }
  .controls button.act { background: wheat; }
  hr { border: none; border-top: thin dotted saddlebrown; }
</style>
</head>
<body class="morning">

<header>Lost Property<small>the office at Saltmarsh Halt</small></header>

<main>
  <fieldset id="shelf">
    <legend>The shelf</legend>
    <ul id="items"></ul>
    <hr>
    <div id="tag" class="tag"></div>
  </fieldset>

  <fieldset id="counter">
    <legend>The counter</legend>
    <div id="talk"></div>
    <div id="controls" class="controls"></div>
  </fieldset>
</main>

<script>
/*
  A small game with no mathematics in it: nothing is counted, scored,
  measured or rolled. The day is a queue of people; the shelf is a list
  of things; each luggage tag is a few words written by whoever found it.
  The only skill is reading.
*/

const ITEMS = {

  },
  book: {

  },
  scarf: {
    name: "a long scarf",

  greyglove: {

const ASK = {
  look: "What does it look like?",
  where: "Where did you last have it?",
  mine: "How would I know it's yours?"
};

const DAY = [
  { phase: "morning", text: "Monday morning. The first train has come and gone. Rain is thinking about it over the marshes. You unlock the hatch and lift the shutter." },

    wrong: {
      cage: "Doves, normally. Not today, thank you.",
      book: "No. I find shells upsetting. Something about the way they keep looking empty."
    },
    patience: ["Alas, no."],
    leaves: "Then I shall vanish.",
    turnedAway: "\"Then I shall vanish,\" he says, and turns round, and he hasn't, but it was a very good try.",
    home: "Mr Pellegrini went to his next show with his hat, and the cat followed him to the end of the platform, and thought better of it.",
    away: "Mr Pellegrini did his next show without a hat, and nothing came out of anything."
  },

  {
    who: "Miss Pell",
    key: "agnes",
    when: not("agnes", "home"),
    looks: "Agnes Pell, in the same green hat. She looks as if she has not slept and has decided not to mind.",
    opens: "I'm sorry. I came back. I thought perhaps I asked the wrong way.",
    look: "Paper, I suppose. If he wrote. He did say he might write.",
    where: "He said he'd leave it here. Here, where you are.",
    mine: "Agnes Pell. P, E, L, L. He never gets that right.",
    item: "letter",
    thanks: "She looks at her name for a long moment. \"He spelled it right,\" she says. She doesn't open it here, either.",
    wrong: { book: "No. He doesn't know a whelk from a winkle." },
    patience: ["No. Paper. A letter."],
    leaves: "No. All right. That's that, then.",
    turnedAway: "\"No,\" she says. \"Of course.\" And this time she goes without buttoning her gloves.",
    home: "Agnes Pell got her letter a day late, and read it on the bench under the timetable board, and then read it again.",
    away: "Agnes Pell has stopped asking."
  },

  {
    when: () => fate.agnes === "home",
    scene: [
      "A young man in a borrowed suit comes to the hatch, hat in his hands. \"I left a letter,\" he says. \"For a Miss Pell. I just wanted to know if...\"",
      "You tell him she came for it. He stands very still. Then he puts his hat on, takes it off again, says thank you to you and also, for some reason, to the umbrella, and runs for the up train."
    ],
    button: "Watch him go"
  },

  { phase: "afternoon", text: "Afternoon. Gulls on the platform roof. A child on the footbridge is calling a name that isn't Custard; it's a dog, and it comes." },

  {
    who: "Alf",
    key: "alf",
    looks: "An enormous man with coal dust in his eyebrows, from the gasworks. He holds his cap in front of him like something that might protect him from you.",
    opens: "Excuse me. Sorry. It's my scarf. My mother made it. She'll ask.",
    look: "Orange and brown. Stripy. Long. It goes round me and round me and round me and then there's still some left.",
    where: "I hung it on the footbridge to dry, and then a train went under, and I watched the train.",
    mine: "Smells of bonfire. We had a bonfire for my mother's birthday. She likes a bonfire.",
    item: "scarf",
    thanks: "He winds it round himself, and round, and round, and there's still some left. He looks, for a moment, like a small boy.",
    wrong: {
      glove: "That's not a scarf. That's a glove. That wouldn't go round anything.",
      greyglove: "That's somebody's glove. Somebody'll want that."
    },
    patience: ["No. Sorry. Longer."],
    leaves: "I'll tell her it blew away. It sort of did.",
    turnedAway: "\"Right,\" says Alf, very quietly for such a big man. \"I'll tell her it blew away.\"",
    home: "Alf went back to the gasworks in his scarf, and his mother asked, and he could say yes.",
    away: "Alf told his mother it blew away, and she has started on another one, longer."
  },

  {
    who: "Mr Ord",
    key: "ord",
    when: not("ord", "home"),
    looks: "Mr Ord, with a new ball of blue wool sticking out of his pocket.",
    opens: "I started again, but it's not the same. You lose the place, don't you. Did my roses turn up?",
    look: "Roses. Tapestry. Most of a sleeve.",
    where: "The down train. Same as before. I was asleep, if you remember.",
    mine: "The sleeve's for my grandson. He's grown again since yesterday, I shouldn't wonder.",
    item: "knitting",
    thanks: "He takes the bag and lays the new wool in beside the old sleeve. \"Now I've got enough for the whole arm,\" he says, pleased.",
    wrong: { scarf: "Ha! No. That's somebody else's winter." },
    patience: ["Roses, I said."],
    leaves: "Ah well. I'll keep going on the new one.",
    turnedAway: "\"Ah well,\" he says, and goes out already knitting.",
    home: "Mr Ord got his roses back and knitted all the way home, and did not miss his stop, quite.",
    away: "Mr Ord's grandson will have a jumper with sleeves that don't quite match, and won't mind."
  },

  { phase: "dusk", text: "Dusk. The lamps come on along the platform, lamp by lamp. You put the kettle on." },

  {
    who: "Tam",
    key: "tam",
    when: not("tam", "home"),
    looks: "Tam, in his school cap, with cold red ears. He has a slice of bread in his pocket.",
    opens: "Has anyone brought him in? I looked all night. Well. Till bedtime.",
    look: "Yellow. Small. Like custard. He's called Custard.",
    where: "The footbridge. Then I think he went up. Up's where birds go.",
    mine: "He sings when the kettle boils. Is your kettle on? It sounds like it's on.",
    item: "bird",
    thanks: "The kettle boils, and the hatbox sings, and Tam stands completely still in the middle of the booking hall with his mouth open.",
    wrong: { cage: "That's his house. He's still not in it." },
    patience: ["That's not him."],
    leaves: "I'll keep the bread in my pocket. In case.",
    turnedAway: "Tam nods, and goes out, and you hear him calling on the footbridge till it's dark.",
    home: "Tam took Custard home in the hatbox, a day late, and the kettle in his kitchen has never been so busy.",
    away: "Tam still keeps bread in his pocket."
  },

  {
    who: "Mr Marsh",
    key: "marsh",
    when: not("marsh", "home"),
    looks: "Edward Marsh in his railway greatcoat. He takes his cap off. He seems a little embarrassed to be back.",
    opens: "I said it was only a thing. I couldn't sleep, though. Is there any chance?",
    look: "Silver. Worn on one side, where my thumb goes.",
    where: "The buffet, by the teapot. I've retraced my steps till I'm dizzy.",
    mine: "Inside it says she was grateful I kept the light on. In the box. And at home, she meant. I see that now.",
    item: "case",
    thanks: "He opens it and reads the inside, and closes it, and holds it for a while with his thumb in the worn place. \"Thank you,\" he says. \"She'd have liked you.\"",
    wrong: { glove: "No. Thank you, though." },
    patience: ["No. Silver. Small."],
    leaves: "No. Well. It was only a thing.",
    turnedAway: "\"No,\" he says. \"Well. It was only a thing.\" He puts his cap back on with great care.",
    notHere: "He nods. \"It was only a thing,\" he says again, and believes it less.",
    home: "Edward Marsh has his case back, and his light is still on.",
    away: "Edward Marsh does not come back again. The case stays in your drawer, keeping his light on without him.",
    told: "Edward Marsh does not come back again."
  },

  {
    phase: "night",
    text: "Night again. You pull the shutter down. The last train sighs off towards the city, with some of your things on it, going home.",
    lines: {
      plain: "It is raining when you lock up. You take the plain black umbrella down from the shelf, the one that belongs to everyone, and walk home under it, and bring it back in the morning."
    },
    after: ["You turn off the lamp. Whatever is still on the shelf will be lost together for a while longer. That's what the shelf is for."],
    tomorrow: false
  }
];

/* ---------- state ---------- */

let shelf = ["duck", "plain", "glove", "teeth", "jar", "case", "cage", "letter", "knitting", "hat", "book", "scarf"];
let fresh = [];
let chosen = null;
let visitor = null;
let asked = [];
const queue = DAY.slice();
let story = [];
const fate = {};

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
};

/* ---------- shelf ---------- */

function drawShelf() {
  const ul = $("items");
  ul.replaceChildren();
  shelf.forEach(id => {
    const li = el("li");
    if (fresh.includes(id)) li.className = "new";
    const b = el("button", "", ITEMS[id].name);
    b.setAttribute("aria-pressed", String(id === chosen));
    b.onclick = () => { chosen = id; fresh = fresh.filter(f => f !== id); drawShelf(); drawControls(); };
    li.append(b);
    ul.append(li);
  });
  $("tag").textContent = chosen ? ITEMS[chosen].tag : "";
}

/* ---------- counter ---------- */

const talk = (cls, text) => { const p = el("p", cls, text); $("talk").append(p); p.scrollIntoView({ block: "nearest", behavior: "smooth" }); };
const narr = text => talk("narr", text);
const say = text => talk("say", text);
const you = text => talk("you", text);

function controls(buttons) {
  const c = $("controls");
  c.replaceChildren();
  buttons.forEach(([label, fn, opts]) => {
    const b = el("button", opts && opts.act ? "act" : "", label);
    b.onclick = fn;
    if (opts && opts.off) b.disabled = true;
    const s = el("span");
    s.append(b);
    c.append(s);
  });
}

function drawControls() {
  if (!visitor) return;
  const qs = Object.keys(ASK).map(k => [ASK[k], () => ask(k), { off: asked.includes(k) }]);
  controls([
    ...qs,
    [chosen ? "Hand over " + ITEMS[chosen].name : "Hand over... (choose from the shelf)", handOver, { off: !chosen, act: true }],
    ["Say you can't help", refuse, { act: true }]
  ]);
}

function ask(k) {
  asked.push(k);
  you(ASK[k]);
  say(visitor[k]);
  drawControls();
}

function handOver() {
  const id = chosen;
  you("Is this it?");
  narr("You hand over " + ITEMS[id].name + ".");
  if (id === visitor.item) {
    narr(visitor.thanks);
    shelf = shelf.filter(s => s !== id);
    chosen = null;
    settle("home");
    drawShelf();
    depart();
    return;
  }
  const grumble = visitor.patience.shift();
  if (grumble) {
    say((visitor.wrong && visitor.wrong[id]) || grumble);
    drawControls();
  } else {
    say(visitor.leaves);
    narr(visitor.who + " goes.");
    settle(shelf.includes(visitor.item) ? "away" : "told");
    depart();
  }
}

function refuse() {
  you("I'm sorry. I can't help you today.");
  if (shelf.includes(visitor.item)) {
    narr(visitor.turnedAway);
    settle("away");
  } else {
    say(visitor.notHere);
    settle("told");
  }
  depart();
}

function settle(how) {
  fate[visitor.key] = how;
  story.push(visitor[how]);
}

function depart() {
  visitor = null;
  asked = [];
  controls([["Ring the bell for whoever is next", next, { act: true }]]);
}

/* ---------- the day ---------- */

function next() {
  $("talk").replaceChildren();
  let step = queue.shift();
  while (step.when && !step.when()) step = queue.shift();

  if (step.phase === "night") return closing(step);

  if (step.phase) {
    document.body.className = step.phase;
    narr(step.text);
    controls([["Carry on", next, { act: true }]]);
    return;
  }

  if (step.scene) {
    step.scene.forEach(narr);
    if (step.arrive) {
      shelf.push(step.arrive);
      fresh.push(step.arrive);
      drawShelf();
    }
    if (step.story) story.push(step.story);
    controls([[step.button || "Carry on", next, { act: true }]]);
    return;
  }

  visitor = Object.assign({}, step, { patience: step.patience.slice() });
  talk("who", visitor.who);
  narr(visitor.looks);
  say(visitor.opens);
  drawControls();
}

function closing(night) {
  document.body.className = "night";
  chosen = null;
  fresh = [];
  drawShelf();
  const t = $("talk");
  t.className = "closing";
  narr(night.text);
  story.filter(Boolean).forEach(line => talk("", line));
  t.append(el("hr"));
  shelf.forEach(id => {
    if (id === "cage" && !shelf.includes("bird")) {
      talk("", "The empty birdcage hangs by the window. Tam forgot it, of course. Custard won't mind; he has the hatbox, and a kettle at home.");
      return;
    }
    talk("", (night.lines && night.lines[id]) || ITEMS[id].closing);
  });
  if (!shelf.some(Boolean)) talk("", "The shelf is bare.");
  night.after.forEach(narr);
  controls(night.tomorrow
    ? [["Come in on Tuesday", tomorrow, { act: true }]]
    : [["Begin again from Monday", () => location.reload()]]);
}

function tomorrow() {
  $("talk").className = "";
  story = [];
  fresh = [];
  queue.push(...TUESDAY);
  next();
}

/* ---------- opening ---------- */

function begin() {
  drawShelf();
  narr("You keep the lost property office at Saltmarsh Halt: a hatch, a counter, a kettle, and a shelf of things that people put down and forgot to pick up again.");
  narr("Click a thing on the shelf to read the luggage tag the finder tied to it. When someone comes to the hatch, you can ask them about what they've lost, hand something over, or tell them you can't help.");
  narr("People describe things the way they remember them, not the way they look. And not everyone who comes to the hatch is telling the truth.");
  controls([["Lift the shutter", next, { act: true }]]);
}

begin();
</script>
