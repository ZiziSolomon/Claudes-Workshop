<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taipei Metro - Station Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #0f0f1e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .search-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .search-box {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 20px;
        }

        .search-box h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(102, 126, 234, 0.2);
            color: #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            margin-bottom: 12px;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .station-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .station-card:hover {
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(30, 41, 59, 0.95);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .line-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
            color: white;
        }

        .line-badge.R { background: #DC3545; }
        .line-badge.G { background: #28A745; }
        .line-badge.BL { background: #007BFF; }
        .line-badge.BR { background: #8B4513; }
        .line-badge.O { background: #FFA500; }
        .line-badge.C { background: #9B59B6; }

        .station-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .station-name-native {
            font-size: 0.9em;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .station-details {
            color: #cbd5e1;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .detail-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
        }

        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            color: #94a3b8;
            font-weight: 500;
        }

        .detail-value {
            color: #e0e0e0;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .stats-panel {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9em;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .search-section {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚇 Taipei Metro Station Finder</h1>
            <p style="color: #94a3b8;">Search and explore stations across the entire network</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <h3>Search by Name</h3>
                <input type="text" id="stationSearch" placeholder="e.g., Taipei Main, Songshan...">
                <button onclick="searchByName()">Search Stations</button>
            </div>

            <div class="search-box">
                <h3>Filter by Line</h3>
                <select id="lineFilter" onchange="filterByLine()">
                    <option value="">All Lines</option>
                    <option value="R">Red Line (紅線)</option>
                    <option value="G">Green Line (綠線)</option>
                    <option value="BL">Blue Line (藍線)</option>
                    <option value="BR">Brown Line (棕線)</option>
                    <option value="O">Orange Line (橙線)</option>
                    <option value="C">Circular Line (環狀線)</option>
                </select>
                <button onclick="filterByLine()">Apply Filter</button>
            </div>
        </div>

        <div id="resultsContainer" class="results">
            <div class="empty-state">
                <p>👆 Use the search boxes above to find stations</p>
                <p style="margin-top: 10px; font-size: 0.9em;">107 total stations across 6 lines</p>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-value">107</div>
                    <div class="stat-label">Total Stations</div>
                </div>
                <div class="stat">
                    <div class="stat-value">6</div>
                    <div class="stat-label">Lines</div>
                </div>
                <div class="stat">
                    <div class="stat-value">128.2</div>
                    <div class="stat-label">km Network</div>
                </div>
                <div class="stat">
                    <div class="stat-value">2.1M</div>
                    <div class="stat-label">Daily Riders</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Station database (simplified Circular Line data for demo)
        const circularLineStations = [
            { name: "Dapinglin", native: "大坪林", code: "C01", line: "C", lineColor: "#9B59B6" },
            { name: "Nanshan", native: "南山", code: "C02", line: "C", lineColor: "#9B59B6" },
            { name: "Banqiao", native: "板橋", code: "C03", line: "C", lineColor: "#9B59B6" },
            { name: "Shulin", native: "樹林", code: "C04", line: "C", lineColor: "#9B59B6" },
            { name: "Taishan", native: "泰山", code: "C05", line: "C", lineColor: "#9B59B6" },
            { name: "Xinzhuang", native: "新莊", code: "C06", line: "C", lineColor: "#9B59B6" },
            { name: "Huilong", native: "迴龍", code: "C07", line: "C", lineColor: "#9B59B6" },
            { name: "Fengshan", native: "豐山", code: "C08", line: "C", lineColor: "#9B59B6" },
            { name: "Jingmei", native: "景美", code: "C09", line: "C", lineColor: "#9B59B6" },
            { name: "Xindian", native: "新店", code: "C10", line: "C", lineColor: "#9B59B6" },
            { name: "Xizhi", native: "西芝", code: "C11", line: "C", lineColor: "#9B59B6" },
            { name: "Neihu", native: "內湖", code: "C12", line: "C", lineColor: "#9B59B6" },
            { name: "Songshan", native: "松山", code: "C13", line: "C", lineColor: "#9B59B6" },
            { name: "New Taipei Industrial Park", native: "新北產業園區", code: "C14", line: "C", lineColor: "#9B59B6" },
            { name: "Taipei Main Station", native: "台北車站", code: "Main", line: "R,G,BL,BR", lineColor: "#DC3545" },
        ];

        function createStationCard(station) {
            const lineLetter = station.line.split(',')[0];
            return `
                <div class="station-card">
                    <div class="line-badge" style="background: ${station.lineColor};">${station.line}</div>
                    <div class="station-name">${station.name}</div>
                    <div class="station-name-native">${station.native}</div>
                    <div class="station-details">
                        <div class="detail-item">
                            <div class="detail-label">Station Code:</div>
                            <div class="detail-value">${station.code}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Line:</div>
                            <div class="detail-value">${station.line}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function displayResults(stations) {
            const container = document.getElementById('resultsContainer');
            if (stations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <p>No stations found</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">Try a different search term</p>
                    </div>
                `;
            } else {
                container.innerHTML = stations.map(createStationCard).join('');
            }
        }

        function searchByName() {
            const query = document.getElementById('stationSearch').value.toLowerCase();
            if (!query) {
                displayResults([]);
                return;
            }
            const results = circularLineStations.filter(station =>
                station.name.toLowerCase().includes(query) ||
                station.native.includes(query)
            );
            displayResults(results);
        }

        function filterByLine() {
            const line = document.getElementById('lineFilter').value;
            if (!line) {
                displayResults(circularLineStations);
            } else {
                const results = circularLineStations.filter(station =>
                    station.line.includes(line)
                );
                displayResults(results);
            }
        }

        // Allow Enter key on search
        document.getElementById('stationSearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchByName();
        });
    </script>
</body>
</html>
