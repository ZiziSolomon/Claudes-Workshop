# One-off check: can a `claude setup-token` token read the usage endpoint from a
# GitHub runner? Prints only the percentages, never the token or raw response.
name: Usage probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read usage with the OAuth token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          req = urllib.request.Request(
              "https://api.anthropic.com/api/oauth/usage",
              headers={
                  "Authorization": f"Bearer {os.environ['CLAUDE_CODE_OAUTH_TOKEN']}",
                  "anthropic-beta": "oauth-2025-04-20",
                  "User-Agent": "claude-code",
              },
          )
          try:
              d = json.loads(urllib.request.urlopen(req, timeout=15).read())
              for k in ("five_hour", "seven_day"):
                  v = d.get(k) or {}
                  print(f"usage endpoint {k}: {v.get('utilization')}% resets {v.get('resets_at')}")
          except urllib.error.HTTPError as e:
              print("usage endpoint: HTTP", e.code, e.reason)

          # Fallback: a 1-token request; subscription limits come back as headers.
          body = json.dumps({
              "model": "claude-haiku-4-5-20251001", "max_tokens": 1,
              "system": "You are Claude Code, Anthropic's official CLI for Claude.",
              "messages": [{"role": "user", "content": "hi"}],
          }).encode()
          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages", data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['CLAUDE_CODE_OAUTH_TOKEN']}",
                  "anthropic-beta": "oauth-2025-04-20",
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
                  "User-Agent": "claude-code",
              },
          )
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print("messages: HTTP", r.status)
              for k, v in sorted(r.headers.items()):
                  if "ratelimit" in k.lower():
                      print(f"  {k}: {v}")
          except urllib.error.HTTPError as e:
              print("messages: HTTP", e.code, e.read()[:300])
          EOF
